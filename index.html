<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FENDI STORE</title>
  <!-- Menghubungkan File CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

  <!-- ================= TOP BAR (LEBIH BESAR & CEMBUNG) ================= -->
  <div class="top-bar-wrapper">
    <header class="top-bar">
      <!-- Kiri: Foto Profil & Nama FENDI STORE -->
      <div class="profile-section">
        <div class="profile-avatar">
          <img src="profile.webp" alt="Foto Profil" class="profile-img">
        </div>
        <div class="brand-wrapper">
          <span class="typing-text">FENDI STORE</span>
        </div>
      </div>

      <!-- Kanan: Tombol Mode Terang / Gelap -->
      <button id="themeToggle" class="theme-toggle-btn" title="Ganti Mode">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>
  </div>

  <!-- ================= KONTEN UTAMA (KOSONG) ================= -->
  <main class="main-content">
    <div class="accent-frame">
      <div class="corner-line top-left"></div>
      <div class="corner-line top-right"></div>
      <div class="corner-line bottom-left"></div>
      <div class="corner-line bottom-right"></div>
      
      <div class="empty-state">
        <div class="pulse-ring"></div>
        <h2>Area Utama Kosong</h2>
        <p>Siap diisi dengan konten atau fitur kamu nanti.</p>
      </div>
    </div>
  </main>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <nav class="bottom-nav-wrapper">
    <div class="bottom-nav">
      <!-- Indikator Highlight Kapsul Cembung -->
      <div class="nav-indicator"></div>

      <!-- Menu 1: Home -->
      <a href="#home" class="nav-item active" data-index="0">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span>Home</span>
      </a>

      <!-- Menu 2: Produk -->
      <a href="#produk" class="nav-item" data-index="1">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span>Produk</span>
      </a>

      <!-- Menu 3: DataMe -->
      <a href="#datame" class="nav-item" data-index="2">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M21 19c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          </svg>
        </div>
        <span>DataMe</span>
      </a>

      <!-- Menu 4: Akun -->
      <a href="#akun" class="nav-item" data-index="3">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <span>Akun</span>
      </a>
    </div>
  </nav>

  <!-- Menghubungkan File JS -->
  <script src="script.js"></script>
</body>
</html>
